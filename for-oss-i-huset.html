<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>För oss i huset — Föreningshuset</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

  <!-- ═══ NAV ═══ -->
  <header class="site-nav">
    <div class="container site-nav-inner">
      <a href="/" class="nav-brand">
        <span class="brand-logo-plate"><img src="images/logo.png" alt="Föreningshuset Ystad" class="brand-logo"></span>
      </a>
      <nav class="nav-pills-row" aria-label="Huvudnavigation">
        <a href="/" class="nav-pill">Hem</a>
        <a href="om-oss.html" class="nav-pill">Om oss</a>
        <a href="verksamheter.html" class="nav-pill">Verksamheter</a>
        <a href="for-oss-i-huset.html" class="nav-pill nav-pill--cta">För oss i huset</a>
      </nav>
    </div>
  </header>

  <!-- ═══ LÖSENORDSSPÄRR ═══ -->
  <section class="auth-wrap">
    <div class="auth-card">
      <div class="auth-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>För oss i huset</h1>
      <p class="auth-lede">Vårt intranät med rutiner, regler och bokning av lokal. Ange lösenordet för att komma in.</p>

      <div class="auth-error" id="fhPasswordError">Fel lösenord — försök igen.</div>

      <form id="fhPasswordForm" autocomplete="off">
        <div class="field">
          <label for="fhPasswordInput">Lösenord</label>
          <input type="password" id="fhPasswordInput" name="fhPassword" placeholder="••••" required autofocus>
        </div>
        <button type="submit" class="btn btn-amber btn-block">Logga in →</button>
      </form>

      <a href="/" class="auth-back">← Tillbaka till startsidan</a>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script>fhInitPasswordForm();</script>
</body>
</html>
